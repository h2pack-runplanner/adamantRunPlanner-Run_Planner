[config]
schemaVersion = "0.0.1"

[package]
namespace = "adamantRunPlanner"
name = "Run_Planner"
description = "The Hades II game companion to the Run Planner application."
versionNumber = "0.3.0"
websiteUrl = "https://github.com/h2pack-runplanner/adamantRunPlanner-Run_Planner"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.78"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-ReLoad = "1.0.2"
SGG_Modding-ModUtil = "4.0.1"
adamant-ModpackLib = "4.0.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"

[publish]
repository = "https://thunderstore.io"
communities = ["hades-ii"]

[publish.categories]
hades-ii = ["modpacks"]
